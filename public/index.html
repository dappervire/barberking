<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <title>Barber King</title>
</head>
<body>
  <main class="split-layout">
    <section class="brand-panel">
      <img src="/images/logo.svg" alt="Logo Barbershop" class="logo">
      <h1>Booking Barbershop</h1>
      <p class="brand-tagline">Masuk dulu, pilih layanan dan jadwal, lalu tunggu konfirmasi dari kami.</p>

      <div id="serviceSection" class="service-section" hidden>
        <h2>Layanan</h2>
        <ul id="serviceList" class="service-list"></ul>
      </div>
    </section>

    <section class="form-panel">
      <div class="form-panel-inner">
        <h2>Masuk Sebagai</h2>
        <div class="role-choices">
          <a href="/customer-login.html" class="role-card">
            <span class="role-card-title">Pelanggan</span>
            <span class="role-card-text">Booking jadwal di barbershop</span>
          </a>
          <a href="/admin-login.html" class="role-card">
            <span class="role-card-title">Admin</span>
            <span class="role-card-text">Kelola booking yang masuk</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/format.js"></script>
  <script src="/js/service-list.js"></script>
  <script>loadServiceList().catch((error) => console.error('Gagal load layanan:', error));</script>
</body>
</html>
