<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <title>Login Pelanggan</title>
</head>
<body>
  <main class="split-layout">
    <section class="brand-panel">
      <img src="/images/logo.svg" alt="Logo Barbershop" class="logo">
      <h1>Login Pelanggan</h1>
      <p class="brand-tagline">Masuk pakai nomor HP kamu buat booking jadwal.</p>
    </section>

    <section class="form-panel">
      <div class="form-panel-inner form-panel-narrow">
        <h2>Masuk ke Akun</h2>

        <form id="customerLoginForm" class="login-form">
          <label>No HP:
            <input type="tel" name="phone" autocomplete="username" placeholder="08xxxxxxxxxx" required>
          </label>

          <label>Password:
            <input type="password" name="password" autocomplete="current-password" required>
          </label>

          <button type="submit">Login</button>
        </form>
        <a href="/customer-register.html" class="panel-link">Belum punya akun? Daftar di sini</a>
        <a href="/" class="panel-link">Kembali ke halaman awal</a>
      </div>
    </section>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/password-toggle.js"></script>
  <script src="/js/customer-auth.js"></script>
</body>
</html>
